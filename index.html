    <!-- ===== SEO: edit the title / description / site address here ===== -->

      name="description"
      content="Portfolio of Subhasini Paul, a full stack developer and 3rd-year B.Tech CSE student at Lovely Professional University building full-stack web applications with Node.js, Express.js, MongoDB and React."

    <meta name="author" content="Subhasini Paul" />

    <meta
      property="og:description"
      content="Full stack developer and 3rd-year B.Tech CSE student building practical web applications. Projects, internship, certifications and contact."
    />
    <meta property="og:url" content="https://my-personal1portfolio.netlify.app/" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <body>
    <div id="root"></div>
    <noscript>This portfolio needs JavaScript. You can reach me at paulsubhasini31@gmail.com.</noscript>

    <!-- Netlify Forms: this hidden copy lets Netlify find the contact form
         when the site is built. Keep the field names the same as in
         src/components/Contact.jsx. -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
